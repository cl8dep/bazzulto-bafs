[package]
name = "bafs"
version = "0.1.0"
edition = "2021"
description = "Bazzulto File System — a professional copy-on-write filesystem for the Bazzulto OS"
authors = ["Bazzulto OS Contributors"]

# ─── Feature flags ────────────────────────────────────────────────────────────
#
# kernel   — activates no_std + alloc mode and implements the kernel VFS Inode
#            trait so the filesystem can be mounted inside the Bazzulto kernel.
#
# userspace — activates std mode for host-side tooling (bafs-mkfs, bafs-fsck)
#             and for the integration test suite.
#
# If neither feature is active the crate still compiles but only the core
# on-disk structures and algorithms are exposed (useful as a library).
# ──────────────────────────────────────────────────────────────────────────────
[features]
default = []
kernel    = []
userspace = []

[dependencies]
# No external dependencies.  Every algorithm (CRC32C, xxHash-64, B-tree) is
# hand-rolled inside the crate so that the kernel build stays hermetic and
# requires no network access or vendored third-party code.

[dev-dependencies]
# The test harness always has access to std (cargo test links the standard
# library automatically), so no extra dependencies are needed here either.
