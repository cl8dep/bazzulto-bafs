# .cargo/config.toml for the bafs standalone crate.
#
# When BAFS lives as a submodule inside the Bazzulto OS kernel tree, the
# parent kernel/.cargo/config.toml sets target = "aarch64-unknown-none" and
# enables build-std.  Those settings break `cargo test` because the test
# harness requires std.
#
# This file overrides the parent by NOT setting [unstable] build-std, which
# lets cargo use the pre-built std from the toolchain for the host target.
#
# If running from within the kernel tree still causes "duplicate lang item"
# errors, run cargo from OUTSIDE the tree:
#
#   cd /tmp
#   cargo test --manifest-path /path/to/bafs/Cargo.toml
#
# In CI (GitHub Actions) the repo is checked out standalone, so this config
# is the only one cargo sees and tests run on the native host target.
